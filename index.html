<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="tiktok-developers-site-verification" content="hub-project">
<title>TikTok OAuth callback</title>
<style>
  body { font: 17px/1.6 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         max-width: 760px; margin: 40px auto; padding: 0 20px; color: #161823; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  .ok { color: #0a7d33; }
  .bad { color: #c0202b; }
  pre { background: #f4f4f6; padding: 14px; border-radius: 8px; overflow-x: auto;
        white-space: pre-wrap; word-break: break-all; font-size: 14px; }
  .row { margin: 14px 0; }
  .k { color: #6a6a72; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  button { font: inherit; padding: 9px 16px; border: 0; border-radius: 8px;
           background: #161823; color: #fff; cursor: pointer; }
  button:active { transform: translateY(1px); }
  .muted { color: #6a6a72; font-size: 14px; }
</style>
</head>
<body>
<h1 id="title">Проверяю параметры…</h1>
<p class="muted" id="hint"></p>

<div class="row">
  <div class="k">code</div>
  <pre id="code">—</pre>
</div>
<div class="row">
  <div class="k">state</div>
  <pre id="state">—</pre>
</div>
<div class="row">
  <div class="k">error</div>
  <pre id="error">—</pre>
</div>

<div class="row">
  <button id="copy">Скопировать весь адрес страницы</button>
</div>

<script>
(function () {
  var p = new URLSearchParams(location.search);
  var code = p.get('code') || '';
  var state = p.get('state') || '';
  var err = p.get('error') || p.get('error_description') || '';
  document.getElementById('code').textContent = code || '—';
  document.getElementById('state').textContent = state || '—';
  document.getElementById('error').textContent = err || '—';

  var title = document.getElementById('title');
  var hint = document.getElementById('hint');
  if (code) {
    title.textContent = 'Готово: TikTok вернул код';
    title.className = 'ok';
    hint.textContent = 'Скопируй адрес этой страницы целиком и вставь его в консоль — python bot.py auth.';
  } else if (err) {
    title.textContent = 'TikTok вернул ошибку';
    title.className = 'bad';
    hint.textContent = 'Смотри поле error выше: обычно это отказ в доступе или несовпадение redirect_uri.';
  } else {
    title.textContent = 'Параметров нет';
    hint.textContent = 'Страница открыта напрямую. Нужно прийти сюда после авторизации через TikTok.';
  }

  document.getElementById('copy').addEventListener('click', function () {
    navigator.clipboard.writeText(location.href).then(function () {
      document.getElementById('copy').textContent = 'Скопировано';
      setTimeout(function () { document.getElementById('copy').textContent = 'Скопировать весь адрес страницы'; }, 1500);
    });
  });
})();
</script>
</body>
</html>
